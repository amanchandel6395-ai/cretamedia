<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0d0c">
  <title>CRETA MEDIA — Cinematic Virtual Studio Headquarters | 3D Production Walkthrough</title>
  <meta name="description" content="Step inside CRETA MEDIA headquarters in interactive 3D. Explore our 9 specialized departments: Exterior, Lobby, Dubbing Booth, Localization in 70+ Languages, Video Editing Bay, Dolby Atmos Audio Theater, AI Production Lab, Microdrama Soundstage, and Grand Showcase Hall.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Fullscreen reset & baseline */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0d0c;
      color: #f4efe6;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #webgl-canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: auto;
      cursor: grab;
      touch-action: none;
      background: #101413;
    }
    #webgl-canvas-container:active {
      cursor: grabbing;
    }
    #webgl-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .cinema-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, transparent 48%, rgba(8, 10, 9, 0.55) 100%),
                  linear-gradient(180deg, rgba(8, 10, 9, 0.65) 0%, transparent 14%, transparent 86%, rgba(8, 10, 9, 0.75) 100%);
    }

    /* Initial Experience Loader */
    #experienceLoader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #0a0d0c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
    }
    #experienceLoader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-brand {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.28em;
      color: #ffffff;
      text-transform: uppercase;
    }
    .loader-brand span {
      color: #e5b875;
    }
    .loader-tagline {
      font-size: 13px;
      letter-spacing: 0.16em;
      color: #8ea49d;
      text-transform: uppercase;
    }
    .loader-bar-track {
      width: 240px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .loader-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #e5b875, #ffdfa9);
      animation: loaderProgress 1.4s ease-in-out forwards;
    }
    @keyframes loaderProgress {
      0% { width: 0%; }
      50% { width: 75%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- 3D Studio WebGL Viewport -->
  <div id="webgl-canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <!-- Cinematic Vignette Overlay -->
  <div class="cinema-vignette"></div>

  <!-- Smooth Initial Loader -->
  <div id="experienceLoader">
    <div class="loader-brand">CRETA <span>MEDIA</span></div>
    <div class="loader-tagline">Initializing Virtual Headquarters...</div>
    <div class="loader-bar-track">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loader = document.getElementById('experienceLoader');
        if (loader) loader.classList.add('hidden');
      }, 700);
    });
  </script>

  <!-- Main 3D Studio Architecture & Interaction Script -->
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
